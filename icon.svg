<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>
    <linearGradient id="orbeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="ghostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Fundo com Borda Neon -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)"/>
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="#38BDF8" stroke-width="6" stroke-opacity="0.35"/>
  <!-- Pistas do Labirinto -->
  <path d="M 80 130 H 210 V 210 H 130" fill="none" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" stroke-opacity="0.2"/>
  <path d="M 432 130 H 302 V 210 H 382" fill="none" stroke="#818CF8" stroke-width="12" stroke-linecap="round" stroke-opacity="0.2"/>
  <path d="M 80 382 H 210 V 302 H 130" fill="none" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" stroke-opacity="0.2"/>
  <!-- Fantasma Espectro -->
  <g transform="translate(245, 145) scale(1.15)" filter="url(#neonGlow)">
    <path d="M 60 120 C 60 35, 160 35, 160 120 L 160 185 L 135 162 L 110 185 L 85 162 L 60 185 Z" fill="url(#ghostGrad)"/>
    <circle cx="95" cy="95" r="13" fill="#FFFFFF"/>
    <circle cx="125" cy="95" r="13" fill="#FFFFFF"/>
    <circle cx="90" cy="95" r="7" fill="#0F172A"/>
    <circle cx="120" cy="95" r="7" fill="#0F172A"/>
  </g>
  <!-- Pac-Orbe Dourado com Brilho Neon -->
  <g filter="url(#neonGlow)">
    <circle cx="185" cy="285" r="105" fill="url(#orbeGrad)"/>
    <polygon points="185,285 305,225 305,345" fill="#050811"/>
    <circle cx="175" cy="235" r="13" fill="#050811"/>
    <circle cx="178" cy="232" r="5" fill="#FFFFFF"/>
  </g>
  <!-- Núcleo de Energia (Eclipse Pellet) -->
  <circle cx="365" cy="285" r="20" fill="#38BDF8" filter="url(#neonGlow)"/>
  <circle cx="365" cy="285" r="10" fill="#FFFFFF"/>
  <circle cx="435" cy="285" r="10" fill="#FDE68A" opacity="0.8"/>
</svg>
